<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Heladería</title>
</head>
<body>
    <div id="root"></div>
    
    <script type="module">
        import React from "https://esm.sh/react@19.2.0?dev";
        import { createRoot } from
        "https://esm.sh/react-dom@19.2.0/client?dev";

        const itemName = React.createElement("h2", null, "Mora silvestre");
        const moraDescription = React.createElement(
            "p",
            { className: "menu-item-description" },
            "Mora de Ambato con un toque de limón."
        );
        const moraItem = React.createElement(
            "article",
            { className: "menu-item" },
            itemName,
            moraDescription
        );

        const naranjaName = React.createElement("h2", null, "Naranja Lima");
        const naranjaDescription = React.createElement(
            "p",
            { className: "menu-item-description" },
            "Naranja y limón combinados en un postre refrescante."
        );
        const naranjaItem = React.createElement(
            "article",
            { className: "menu-item" },
            naranjaName,
            naranjaDescription
        );

        console.log(itemName.props);
        const heading = React.createElement("h1", null, "La Heladería");
        const menu = React.createElement(
            "main",
            null,
            heading,
            moraItem,
            naranjaItem
        );

        createRoot(document.getElementById("root")).render(menu);
    </script>
</body>
</html>
